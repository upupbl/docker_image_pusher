name: Docker

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Images to mirror
        required: true
        default: all
        type: choice
        options:
          - all
          - changed
  push:
    branches: [main]
    paths:
      - images.txt
      - scripts/push-images.sh
      - .github/workflows/docker.yaml

permissions:
  contents: read

concurrency:
  group: docker-image-pusher-${{ github.ref }}
  cancel-in-progress: true

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  mirror:
    name: Mirror images
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Disk space before preparation
        run: df -hT

      # Pin the third-party action to the commit already verified by run #51.
      - name: Maximize build space
        uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794
        with:
          root-reserve-mb: 4096
          swap-size-mb: 128
          remove-dotnet: 'true'
          remove-haskell: 'true'
          build-mount-path: /var/lib/docker/

      - name: Restart Docker
        run: sudo service docker restart

      - name: Disk space after preparation
        run: df -hT

      - name: Mirror images to Aliyun
        env:
          SYNC_SCOPE: "${{ inputs.scope }}"
          BEFORE_SHA: "${{ github.event.before }}"
        run: bash scripts/push-images.sh

      - name: Docker logout
        if: always()
        run: docker logout "$ALIYUN_REGISTRY" || true

      - name: Final disk space
        if: always()
        run: df -hT
